<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>Genpong Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-side" id="hudL"></div>
  <div class="hud-mid" id="hudM"></div>
  <div class="hud-side right" id="hudR"></div>
  <div class="hud-btns">
    <button id="muteBtn" aria-label="Sound">🔊</button>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>
</div>
<div id="banner"></div>
<div id="hint" class="hidden">Touch &amp; drag <b>down</b> (and sideways to aim), then release to throw</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>GEN<span>PONG</span></h1>
    <p class="sub">Online edition &middot; keeping the tradition warm until 2027</p>
    <div class="seg" id="modeSeg">
      <button data-mode="solo" class="on">Solo</button>
      <button data-mode="versus">Same screen</button>
      <button data-mode="online">Online</button>
    </div>
    <div class="player" id="p1">
      <label>Player 1</label>
      <input id="n1" maxlength="16" placeholder="Your name" autocomplete="off">
      <div class="drinks" id="d1"></div>
    </div>
    <div class="player" id="p2" hidden>
      <label>Player 2</label>
      <input id="n2" maxlength="16" placeholder="Name" autocomplete="off">
      <div class="drinks" id="d2"></div>
    </div>
    <div id="onlineBox" hidden>
      <button id="createBtn" class="primary">Create game</button>
      <div class="or">or join a friend's game</div>
      <div class="joinrow"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="joinBtn" class="secondary">Join</button></div>
      <p id="netStatus" class="small"></p>
    </div>
    <button id="play" class="primary">Play</button>
    <p id="best" class="small"></p>
    <p class="small dim">Unofficial fan-made game. Water is a perfectly valid drink.</p>
  </div>
</div>

<div id="lobby" class="overlay hidden">
  <div class="card">
    <h2>Waiting for a friend…</h2>
    <p class="sub">Send them this link, or tell them the code</p>
    <div class="code" id="lobbyCode">····</div>
    <input id="lobbyLink" class="linkbox" readonly>
    <button class="primary" id="lobbyCopy">Copy invite link</button>
    <button class="secondary" id="lobbyCancel">Cancel</button>
  </div>
</div>

<div id="peerGone" class="overlay hidden">
  <div class="card">
    <h2>Game over</h2>
    <p class="sub" id="peerGoneText"></p>
    <button class="primary" id="peerGoneMenu">Back to menu</button>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card" id="resultCard"></div>
</div>

<script src="config.js"></script>
<script src="live.js"></script>
<script src="game.js"></script>
</body>
</html>
