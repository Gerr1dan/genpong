<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>Genpong Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-side" id="hudL"></div>
  <div class="hud-mid" id="hudM"></div>
  <div class="hud-side right" id="hudR"></div>
  <div class="hud-btns">
    <button id="muteBtn" aria-label="Sound">🔊</button>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>
</div>
<div id="banner"></div>
<div id="hint" class="hidden">Touch &amp; drag <b>down</b> (and sideways to aim), then release to throw</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>GEN<span>PONG</span></h1>
    <p class="sub">Online edition &middot; keeping the tradition warm until 2027</p>
    <div class="seg" id="modeSeg">
      <button data-mode="solo" class="on">Solo</button>
      <button data-mode="versus">2 Players</button>
    </div>
    <div class="player" id="p1">
      <label>Player 1</label>
      <input id="n1" maxlength="16" placeholder="Your name" autocomplete="off">
      <div class="drinks" id="d1"></div>
      <div class="cupsel" id="k1"></div>
    </div>
    <div class="player" id="p2" hidden>
      <label>Player 2</label>
      <input id="n2" maxlength="16" placeholder="Name" autocomplete="off">
      <div class="drinks" id="d2"></div>
      <div class="cupsel" id="k2"></div>
    </div>
    <button id="play" class="primary">Play</button>
    <p id="best" class="small"></p>
    <p class="small dim">Unofficial fan-made game. Water is a perfectly valid drink.</p>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card" id="resultCard"></div>
</div>

<script src="game.js"></script>
</body>
</html>
